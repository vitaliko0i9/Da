<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%= title %></title>
  <meta name="description" content="<%= description %>">
  <meta property="og:title" content="<%= title %>">
  <meta property="og:description" content="<%= description %>">
  <meta property="og:image" content="<%= siteUrl %><%= ogImage %>">
  <meta property="og:type" content="<%= type %>">
  <link rel="icon" href="/favicon.svg">

  <!-- Preload LCP hero image -->
  <link rel="preload" as="image" href="/images/hero-ocean.webp" type="image/webp">

  <!-- Preconnect для прискорення підключення до Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Шрифти Google: завантажуємо в неблокуючому режимі -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600;700&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600;700&display=swap"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600;700&display=swap">
  </noscript>

  <!-- Основні стилі сайту -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sea-glow"></div>
